<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DviSetu | Challenges Registry</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <!-- Dynamic Application Header -->
  <header id="app-header" class="app-header"></header>

  <div class="app-container">
    <!-- Dynamic Sidebar -->
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <!-- Main Body -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Innovation Challenges Registry</h1>
          <p class="page-subtitle">Repository of all published government problem statements and procurement pilots.</p>
        </div>
        <a href="create-challenge.html" class="btn btn-saffron">+ Create Challenge</a>
      </div>

      <!-- Filters & Search Bar -->
      <div class="card" style="margin-bottom: 24px;">
        <div class="card-body" style="padding: 16px;">
          <div class="grid grid-3">
            <div>
              <input type="text" id="search-query" class="form-control" placeholder="Search by title, ID, or keywords...">
            </div>
            <div>
              <select id="filter-sector" class="form-control">
                <option value="">All Sectors</option>
                <option value="Healthcare & HealthTech">Healthcare & HealthTech</option>
                <option value="Urban Infrastructure & Smart City">Urban Infrastructure & Smart City</option>
                <option value="Waste Management & Cleantech">Waste Management & Cleantech</option>
                <option value="GovTech & Artificial Intelligence">GovTech & Artificial Intelligence</option>
              </select>
            </div>
            <div>
              <select id="filter-status" class="form-control">
                <option value="">All Statuses</option>
                <option value="Open">Open</option>
                <option value="Screening">Screening</option>
                <option value="Evaluation">Evaluation</option>
                <option value="Pilot Running">Pilot Running</option>
                <option value="Scaled">Scaled</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Challenges List Cards -->
      <div id="challenges-grid" class="grid grid-2">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/rules.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/challenges.js"></script>
</body>
</html>
