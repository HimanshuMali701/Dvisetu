<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DviSetu | Browse Challenges</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <!-- Dynamic Header -->
  <header id="app-header" class="app-header"></header>

  <div class="app-container">
    <!-- Dynamic Sidebar -->
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Browse Open Government Challenges</h1>
          <p class="page-subtitle">Apply for competitive innovation procurement challenges with automated eligibility scoring.</p>
        </div>
      </div>

      <!-- Search & Filter Bar -->
      <div class="card" style="margin-bottom: 24px;">
        <div class="card-body" style="padding: 16px;">
          <div class="grid grid-2">
            <input type="text" id="startup-search-input" class="form-control" placeholder="Search by title, sector, or required technology...">
            <select id="startup-sector-filter" class="form-control">
              <option value="">All Sectors</option>
              <option value="Healthcare & HealthTech">Healthcare & HealthTech</option>
              <option value="Urban Infrastructure & Smart City">Urban Infrastructure & Smart City</option>
              <option value="Waste Management & Cleantech">Waste Management & Cleantech</option>
              <option value="GovTech & Artificial Intelligence">GovTech & Artificial Intelligence</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Challenge Grid -->
      <div id="startup-challenges-grid" class="grid grid-2">
        <!-- Injected via JS -->
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/rules.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/browse-challenges.js"></script>
</body>
</html>
